[package]
name = "generalship-g0"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
world-of-nodes = { path = ".." }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
futures-util = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.28"

[[bin]]
name = "generalship-server"
path = "src/main.rs"
